<svg xmlns="http://www.w3.org/2000/svg" width="780" height="200" viewBox="0 0 780 200" role="img" aria-labelledby="title desc">
  <title id="title">TLS connection fallback in pixel art</title>
  <desc id="desc">A pixel-art user and robot exchange a protected connection. An unavailable route leads to an available alternative. Decorative illustration without visible text.</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4a9eda"/></marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#74aa63"/></marker>
  </defs>
  <rect width="780" height="200" rx="12" fill="#fafbfc"/>

  <!-- Original characters drawn on the same 7px grid as the sibling plugin. -->
  <g transform="translate(38 65)" shape-rendering="crispEdges">
    <path d="M14 0h28v7H14zM7 7h42v7H7zM7 14h7v14H7z" fill="#8b5e3c"/>
    <path d="M14 14h35v21H14zM21 35h21v7H21zM0 49h7v14H0zM49 49h7v14h-7z" fill="#ffdab9"/>
    <path d="M21 21h7v7h-7zM42 21h7v7h-7z" fill="#333"/>
    <path d="M28 35h7v7h-7z" fill="#d4956a"/>
    <path d="M7 42h42v21H7z" fill="#4a9eda"/>
    <path d="M7 63h14v14H7zM35 63h14v14H35z" fill="#444"/>
    <rect x="14" y="49" width="28" height="14" fill="#2c5f8a"/>
    <rect x="21" y="49" width="14" height="7" fill="#e8f4fd"/>
  </g>
  <g transform="translate(686 65)" shape-rendering="crispEdges">
    <rect x="28" y="0" width="7" height="7" fill="#ffd700"/>
    <rect x="28" y="7" width="7" height="7" fill="#444"/>
    <rect x="7" y="14" width="42" height="28" fill="#74aa63"/>
    <path d="M0 21h7v14H0zM49 21h7v14h-7z" fill="#555"/>
    <path d="M14 21h7v7h-7zM35 21h7v7h-7z" fill="#333"/>
    <rect x="21" y="35" width="14" height="7" fill="#3d6b33"/>
    <rect x="7" y="49" width="42" height="14" fill="#4a9eda"/>
    <path d="M0 49h7v14H0zM49 49h7v14h-7z" fill="#74aa63"/>
    <path d="M7 63h14v14H7zM35 63h14v14H35z" fill="#444"/>
  </g>

  <!-- Blue request bubble, orange unavailable-route bubble, green fallback. -->
  <rect x="118" y="35" width="245" height="42" rx="8" fill="#e8f4fd" stroke="#4a9eda" stroke-width="1.5"/>
  <path d="M118 49l-11 8 11-1" fill="#e8f4fd" stroke="#4a9eda" stroke-width="1.5"/>
  <rect x="117" y="48" width="3" height="9" fill="#e8f4fd"/>
  <g transform="translate(139 42)" shape-rendering="crispEdges">
    <path d="M7 0h14v7H7zM0 7h7v7H0zM21 7h7v7h-7zM0 14h28v14H0z" fill="#4a9eda"/>
    <rect x="12" y="20" width="4" height="5" fill="#e8f4fd"/>
    <path d="M56 7h7v7h-7zM77 7h7v7h-7zM98 7h7v7h-7zM119 7h7v7h-7zM140 7h7v7h-7zM161 7h7v7h-7z" fill="#4a9eda" opacity=".55"/>
  </g>
  <path d="M375 56H429" stroke="#4a9eda" stroke-width="2" marker-end="url(#blue-arrow)"/>

  <rect x="441" y="35" width="220" height="42" rx="8" fill="#fdf2e8" stroke="#da8a4a" stroke-width="1.5"/>
  <path d="M661 49l11 8-11-1" fill="#fdf2e8" stroke="#da8a4a" stroke-width="1.5"/>
  <rect x="659" y="48" width="3" height="9" fill="#fdf2e8"/>
  <g transform="translate(462 42)" shape-rendering="crispEdges">
    <path d="M0 0h28v7H0zM7 7h14v14H7zM0 21h28v7H0z" fill="#da8a4a"/>
    <path d="M56 7h7v7h-7zM77 7h7v7h-7zM98 7h7v7h-7z" fill="#da8a4a" opacity=".45"/>
    <path d="M147 0h7v7h-7zM168 0h7v7h-7zM154 7h14v14h-14zM147 21h7v7h-7zM168 21h7v7h-7z" fill="#bf6b51"/>
  </g>
  <path d="M551 85v16H426v17" stroke="#74aa63" stroke-width="2" fill="none" marker-end="url(#green-arrow)"/>

  <rect x="210" y="126" width="426" height="42" rx="8" fill="#eafbe7" stroke="#74aa63" stroke-width="1.5"/>
  <g transform="translate(231 133)" shape-rendering="crispEdges">
    <path d="M7 0h14v7H7zM0 7h7v7H0zM21 7h7v7h-7zM0 14h28v14H0z" fill="#74aa63"/>
    <rect x="12" y="20" width="4" height="5" fill="#eafbe7"/>
    <path d="M56 7h7v7h-7zM77 7h7v7h-7zM98 7h7v7h-7zM119 7h7v7h-7zM140 7h7v7h-7zM161 7h7v7h-7zM182 7h7v7h-7zM203 7h7v7h-7zM224 7h7v7h-7zM245 7h7v7h-7zM266 7h7v7h-7z" fill="#74aa63" opacity=".5"/>
    <path d="M336 14h7v7h-7zM343 21h7v7h-7zM350 14h7v7h-7zM357 7h7v7h-7zM364 0h7v7h-7z" fill="#3d6b33"/>
  </g>
  <path d="M647 147h28v-24" stroke="#74aa63" stroke-width="2" fill="none" marker-end="url(#green-arrow)"/>
</svg>
