<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Secure connection fallback</title>
  <desc id="desc">A protected connection chooses an available route while another route is unavailable. Decorative illustration, not a network diagram.</desc>
