    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#BCE6FF" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
